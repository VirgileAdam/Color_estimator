name: Deliver Percepta documentation artifact

on:
  pull_request:
    branches: ["tmp-percepta-docs-prbase"]
    types: [opened, synchronize, reopened, closed]

permissions:
  contents: write

jobs:
  deliver:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify deliverables
        run: |
          test -s README.md
          test -s Percepta_Technical_Manual.pdf
          test -s Percepta_Documentation_Package.zip
          grep -q '^pages: 18$' STATUS.txt
      - name: Upload final documentation
        uses: actions/upload-artifact@v4
        with:
          name: Percepta_Documentation_Final
          path: |
            README.md
            Percepta_Technical_Manual.pdf
            Percepta_Documentation_Package.zip
            STATUS.txt
          if-no-files-found: error
          retention-days: 1

  cleanup:
    if: github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Remove temporary branches
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git init cleanup
          cd cleanup
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin --delete tmp-percepta-docs-prhead || true
          sleep 30
          git push origin --delete tmp-percepta-docs-prbase || true
